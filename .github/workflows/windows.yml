name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # a v* tag publishes the portable ZIP as a GitHub release (hosts such as DOTRACK download it from there)

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --locked -- --test-threads=1
      - name: Portable release
        shell: pwsh
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DOTAPE-Windows-x64
          path: artifacts/DOTAPE-Windows-x64.zip
          if-no-files-found: error
      - name: Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/DOTAPE-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DOTAPE-Windows-x64.zip" | Out-File -Encoding ascii artifacts/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/DOTAPE-Windows-x64.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
